<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="style.css"></head><body>
<div class="tile story" style="background:var(--parchment-deep);">
  <img class="ornament" src="lutherrose.png" style="width:880px; left:-300px; top:-260px;" alt="">
  <div class="head">
    <img src="lutherrose.png" alt="">
    <span class="kicker">Wort für die Woche</span>
  </div>
  <div style="flex:1; display:flex; flex-direction:column; justify-content:center; position:relative;">
    <figure style="margin-left:auto; max-width:820px; border-right:5px solid var(--gold); padding-right:44px; text-align:right;">
      <blockquote style="font-family:'Fraunces'; font-size:74px; font-style:italic; font-weight:450; line-height:1.3; color:var(--aubergine);">
        „Ich hebe meine Augen auf zu den Bergen. Woher kommt mir Hilfe?“
      </blockquote>
      <figcaption style="margin-top:38px; font-size:32px; color:var(--muted);">Psalm 121,1</figcaption>
    </figure>
    <p class="lead" style="font-size:32px; margin-top:88px; max-width:760px;">
      Nimm dir heute einen Moment Stille — und wenn du magst, feiere mit
      uns: sonntags um 09:30 Uhr, ul. Miodowa 21.
    </p>
  </div>
  <div class="foot">
    <span class="site">warschau-evangelisch.de</span>
    <span class="handle">@warschau.evangelisch</span>
  </div>
</div>
</body></html>
