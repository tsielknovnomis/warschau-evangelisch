<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="style.css"></head><body>
<div class="tile" style="padding:0;">
  <div style="padding:72px 84px 44px;">
    <div class="head">
      <img src="lutherrose.png" alt="">
      <span class="kicker">Rückblick</span>
    </div>
  </div>
  <div class="placeholder" style="width:100%; height:660px; border-top:4px solid var(--gold); border-bottom:4px solid var(--gold);">
    <span class="hint">Foto einfügen — 1080 × 660 px<br>(z. B. Kirchenraum, Kaffeetafel, Ausflug)</span>
  </div>
  <div style="flex:1; display:flex; flex-direction:column; padding:52px 84px 72px;">
    <h1 class="display" style="font-size:76px;">
      Danke für diesen <span class="accent">Sonntag.</span>
    </h1>
    <p class="lead" style="font-size:32px; margin-top:28px; max-width:880px;">
      Ein voller Kirchenraum, vertraute Lieder und danach lange Gespräche
      beim Gemeindekaffee. Schön, dass ihr da wart — bis zum nächsten Mal!
    </p>
    <div class="foot" style="padding-top:30px;">
      <span class="site">warschau-evangelisch.de</span>
      <span class="handle">@warschau.evangelisch</span>
    </div>
  </div>
</div>
</body></html>
