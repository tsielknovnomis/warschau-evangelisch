<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="style.css"></head><body>
<div class="tile" style="background:var(--parchment-deep);">
  <img class="ornament" src="lutherrose.png" style="width:760px; left:-240px; bottom:-200px;" alt="">
  <div class="head">
    <img src="lutherrose.png" alt="">
    <span class="kicker">Zum Nachdenken</span>
  </div>
  <div style="flex:1; display:flex; flex-direction:column; justify-content:center; position:relative;">
    <figure style="margin-left:auto; max-width:850px; border-right:5px solid var(--gold); padding-right:44px; text-align:right;">
      <blockquote style="font-family:'Fraunces'; font-size:64px; font-style:italic; font-weight:450; line-height:1.28; color:var(--aubergine);">
        „Ein Christenmensch ist ein freier Herr über alle Dinge und niemand untertan.“
      </blockquote>
      <figcaption style="margin-top:34px; font-size:30px; color:var(--muted);">
        Martin Luther, <span style="font-style:italic;">Von der Freiheit eines Christenmenschen</span> (1520)
      </figcaption>
    </figure>
  </div>
  <div class="foot">
    <span class="site">warschau-evangelisch.de</span>
    <span class="handle">@warschau.evangelisch</span>
  </div>
</div>
</body></html>
