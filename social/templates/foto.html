<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="style.css"></head><body>
<div class="tile" style="padding:0;">
  <!-- FOTO-BEREICH: Platzhalter ersetzen — img einfügen mit object-fit:cover -->
  <div style="height:810px; background:repeating-linear-gradient(45deg, #efe9dd, #efe9dd 24px, #e8e1d2 24px, #e8e1d2 48px); display:flex; align-items:center; justify-content:center; border-bottom:5px solid var(--gold);">
    <div style="text-align:center; background:rgba(255,253,249,0.92); border:2px dashed var(--gold); border-radius:12px; padding:44px 64px;">
      <div style="font-family:'Fraunces'; font-size:44px; color:var(--aubergine); font-weight:500;">Foto einfügen</div>
      <div style="font-size:26px; color:var(--muted); margin-top:12px;">1080 × 810 px · warm &amp; natürlich</div>
    </div>
  </div>

  <div style="flex:1; display:flex; flex-direction:column; padding:64px 84px 72px;">
    <div class="head">
      <img src="lutherrose.png" alt="">
      <span class="kicker">Gemeindeleben</span>
    </div>
    <h1 class="display" style="font-size:62px; margin-top:32px;">
      Überschrift zum Foto — <span class="accent">warm und einladend.</span>
    </h1>
    <div class="foot" style="padding-top:28px;">
      <span class="site">warschau-evangelisch.de</span>
      <span class="handle">@warschau.evangelisch</span>
    </div>
  </div>
</div>
</body></html>
