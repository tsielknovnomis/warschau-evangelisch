<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="style.css"></head><body>
<div class="tile">
  <img class="ornament" src="lutherrose.png" style="width:760px; left:-260px; top:-200px;" alt="">
  <div class="head">
    <img src="lutherrose.png" alt="">
    <span class="kicker">Wir stellen vor</span>
  </div>
  <div style="flex:1; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; position:relative;">
    <div class="placeholder" style="width:420px; height:420px; border-radius:50%; border:4px solid var(--gold);">
      <span class="hint" style="border:none; background:none;">Foto einfügen<br>(quadratisch)</span>
    </div>
    <h1 class="display" style="font-size:76px; margin-top:52px;">Vorname Nachname</h1>
    <p style="margin-top:16px; font-size:28px; letter-spacing:0.14em; text-transform:uppercase; font-weight:600; color:var(--gold-deep);">
      Aufgabe in der Gemeinde
    </p>
    <p class="lead" style="font-size:33px; font-style:italic; margin-top:40px; max-width:800px;">
      „Hier steht ein persönlicher Satz — zum Beispiel, warum mir diese
      Gemeinde am Herzen liegt oder worauf ich mich sonntags freue.“
    </p>
  </div>
  <div class="foot">
    <span class="site">warschau-evangelisch.de</span>
    <span class="handle">@warschau.evangelisch</span>
  </div>
</div>
</body></html>
