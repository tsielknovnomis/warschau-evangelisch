<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="style.css"></head><body>
<div class="tile">
  <div class="head">
    <img src="lutherrose.png" alt="">
    <span class="kicker">Wir sind online</span>
  </div>

  <h1 class="display" style="font-size:88px; margin-top:56px;">
    Unsere neue Website<br><span class="accent">ist da.</span>

  <!-- Browser-Mockup mit echtem Screenshot -->
  <div style="margin-top:56px; border-radius:14px; overflow:hidden; box-shadow:0 30px 70px -25px rgba(72,0,72,0.35); border:1px solid var(--line); background:#fff;">
    <div style="display:flex; gap:9px; padding:16px 20px; background:var(--parchment-deep); border-bottom:1px solid var(--line);">
      <span style="width:14px;height:14px;border-radius:50%;background:#d9c491;"></span>
      <span style="width:14px;height:14px;border-radius:50%;background:#c9b5c8;"></span>

  <p class="lead" style="font-size:33px; margin-top:48px;">
    Termine, Anfahrt, Aktuelles und mehr — schau vorbei und sag uns gern, wie sie dir gefällt.
  </p>

  <div class="foot">
    <span class="site">warschau-evangelisch.de</span>
    <span class="handle">@warschau.evangelisch</span>
  </div>
