<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="style.css"></head><body>
<div class="tile dark">
  <img class="ornament" src="lutherrose.png" style="width:820px; right:-260px; top:50%; transform:translateY(-50%);" alt="">
  <div class="head">
    <img src="lutherrose.png" alt="">
    <span class="kicker">Weihnachten in Warschau</span>
  </div>
  <div style="flex:1; display:flex; flex-direction:column; justify-content:center; position:relative;">
    <h1 class="display" style="font-size:108px;">
      Fürchtet euch <span class="accent">nicht!</span>
    </h1>
    <p style="margin-top:36px; font-size:30px; color:var(--gold-soft); letter-spacing:0.04em;">Lukas 2,10</p>
    <p class="lead" style="font-size:35px; margin-top:56px; max-width:820px;">
      Wir wünschen dir und deinen Liebsten ein gesegnetes, friedliches
      Weihnachtsfest — und freuen uns, wenn wir es gemeinsam feiern:
      Christvesper mit Krippenspiel am 24. Dezember.
    </p>
  </div>
  <div class="foot">
    <span class="site">warschau-evangelisch.de</span>
    <span class="handle">@warschau.evangelisch</span>
  </div>
</div>
