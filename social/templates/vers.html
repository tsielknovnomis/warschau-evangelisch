<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="style.css"></head><body>
<div class="tile" style="background:var(--parchment-deep);">
  <img class="ornament" src="lutherrose.png" style="width:700px; left:-230px; top:50%; transform:translateY(-50%); opacity:0.09;" alt="">
  <div class="head">
    <img src="lutherrose.png" alt="">
    <span class="kicker">Wort für die Woche</span>
  </div>

  <figure style="margin-top:240px; margin-left:auto; max-width:800px; border-right:5px solid var(--gold); padding-right:44px; text-align:right; position:relative;">
    <blockquote style="font-family:'Fraunces'; font-size:64px; font-style:italic; font-weight:450; line-height:1.28; color:var(--aubergine);">
      „Kommt her zu mir alle, die ihr mühselig und beladen seid. Ich will euch erquicken.“
    </blockquote>
    <figcaption style="margin-top:36px; font-size:30px; color:var(--muted);">
      Matthäus 11,28
    </figcaption>
  </figure>

  <div class="foot">
    <span class="site">warschau-evangelisch.de</span>
    <span class="handle">@warschau.evangelisch</span>
  </div>
</div>
</body></html>
