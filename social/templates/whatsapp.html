<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="style.css"></head><body>
<div class="tile">
  <img class="ornament" src="lutherrose.png" style="width:780px; right:-260px; top:-220px;" alt="">
  <div class="head">
    <img src="lutherrose.png" alt="">
    <span class="kicker">Bleib dabei</span>
  </div>
  <div style="flex:1; display:flex; flex-direction:column; justify-content:center; position:relative;">
    <h1 class="display" style="font-size:88px; max-width:900px;">
      Wann wir uns<br>das nächste Mal <span class="accent">treffen?</span>
    </h1>
    <div class="goldrule" style="margin-top:44px;"></div>
    <p class="lead" style="font-size:36px; margin-top:44px; max-width:860px;">
      Das erfährst du zuerst in unserer <strong style="color:var(--aubergine);">WhatsApp-Gruppe</strong> —
      Gottesdienste, Änderungen und was sonst bei uns los ist.
    </p>
    <div style="margin-top:56px; display:flex; align-items:center; gap:36px;">
      <img src="whatsapp-qr.svg" alt="" style="width:210px; height:210px; background:#fff; padding:12px; border:1px solid var(--line); border-radius:6px;">
      <p style="font-size:30px; line-height:1.45; color:var(--muted); max-width:520px;">
        Link im Profil — oder am Rechner einfach mit der Handy-Kamera scannen.
      </p>
    </div>
  </div>
  <div class="foot">
    <span class="site">warschau-evangelisch.de</span>
    <span class="handle">@warschau.evangelisch</span>
  </div>
</div>
</body></html>
