<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="style.css"></head><body>
<div class="tile" style="padding:0;">
  <img src="foto-trinity.jpg" style="position:absolute; inset:0; width:100%; height:100%; object-fit:cover;" alt="">

  <div style="position:absolute; inset:0; background:linear-gradient(to top, rgba(44,34,48,0.72) 0%, rgba(44,34,48,0.25) 16%, transparent 32%);"></div>

  <div style="position:absolute; top:64px; left:64px; display:flex; align-items:center; gap:14px; background:rgba(250,248,243,0.92); border-radius:999px; padding:14px 30px 14px 16px;">
    <img src="lutherrose.png" style="width:44px; height:44px;" alt="">

  </div>
  <!-- Fußzeile auf dem Verlauf -->
  <div style="position:absolute; left:64px; right:64px; bottom:52px; display:flex; justify-content:space-between; align-items:baseline;">
    <span style="font-family:'Fraunces'; font-size:32px; font-weight:500; color:#faf8f3;">warschau-evangelisch.de</span>
    <span style="font-family:'Spectral'; font-size:26px; color:rgba(250,248,243,0.85);">@warschau.evangelisch</span>
  </div>
</div>
</body></html>
