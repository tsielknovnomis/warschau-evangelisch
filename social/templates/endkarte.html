<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="style.css"></head><body>
<!-- Reel end card (last 3 s). Content kept in the upper-middle: Instagram overlays the bottom ~25 % and the right edge. -->
<div class="tile story dark" style="justify-content:flex-start; padding-top:420px;">
  <img class="ornament" src="lutherrose.png" style="width:900px; right:-320px; bottom:-280px;" alt="">
  <div style="position:relative; max-width:820px;">
    <img src="lutherrose.png" alt="" style="width:110px; height:110px;">
    <h1 class="display" style="font-size:92px; margin-top:60px;">
      Wann wir uns<br>das nächste Mal <span class="accent">treffen?</span>
    </h1>
    <div class="goldrule" style="margin-top:60px; background:linear-gradient(90deg, var(--gold-soft), transparent);"></div>
    <p class="lead" style="font-size:44px; margin-top:60px; line-height:1.4;">
      Das steht in unserer<br><strong style="color:var(--gold-soft);">WhatsApp-Gruppe.</strong>
    </p>
    <p style="margin-top:44px; font-size:34px; letter-spacing:.14em; text-transform:uppercase; color:var(--gold-soft); font-weight:600;">Link im Profil</p>
  </div>
</div>
</body></html>
