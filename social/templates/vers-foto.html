<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="style.css"></head><body>
<div class="tile" style="padding:0;">
  <div style="display:flex; flex-direction:column; height:100%;">
    <div style="padding:72px 84px 44px;">
      <div class="head">
        <img src="lutherrose.png" alt="">
        <span class="kicker">Wort für die Woche</span>
      </div>
    </div>
    <!-- Foto-Band -->
    <img src="foto-altar.png" style="width:100%; height:470px; object-fit:cover; object-position:63% 40%; border-top:4px solid var(--gold); border-bottom:4px solid var(--gold);" alt="Altar im Lutherischen Zentrum">
    <div style="flex:1; display:flex; flex-direction:column; padding:56px 84px 72px;">
      <figure style="margin-left:auto; max-width:820px; border-right:5px solid var(--gold); padding-right:40px; text-align:right;">
        <blockquote style="font-family:'Fraunces'; font-size:52px; font-style:italic; font-weight:450; line-height:1.3; color:var(--aubergine);">
          „Denn wo zwei oder drei versammelt sind in meinem Namen, da bin ich mitten unter ihnen.“
        </blockquote>
        <figcaption style="margin-top:26px; font-size:28px; color:var(--muted);">Matthäus 18,20</figcaption>
      </figure>
      <div class="foot" style="padding-top:30px;">
        <span class="site">warschau-evangelisch.de</span>
        <span class="handle">@warschau.evangelisch</span>
      </div>
    </div>
  </div>
</div>
</body></html>
